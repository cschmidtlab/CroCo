[project]
name = "croco"
dynamic = ["version"]
description = "Cross-link mass spectrometry file conversion software"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
# Run the graphical user interface from source.
gui = ["wxPython>=4.2.1"]
# Build the standalone Windows executable (see docs/build_windows.rst).
# The GUI extra is required as well:  pip install ".[gui,build]"
build = ["PyInstaller>=6.0"]
# Packages used by the notebooks in test/.
dev = ["ipykernel>=7.3.0"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is derived automatically from the git tags (hatch-vcs) and
# written to src/croco/_version.py, which the code imports at runtime.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/croco/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/croco"]