name: croco_env
channels:
  - conda-forge
  - defaults
dependencies:
  # Use Python 3.11 or 3.12 on Windows: wxPython ships official
  # wheels for these versions (and PyInstaller 6.x supports them)
  - python=3.12
  - pip
  - setuptools>=68
  - numpy>=1.26
  - pandas>=2.0
  - openpyxl>=3.1
  - wxpython=4.2.1
  - pyinstaller>=6.0